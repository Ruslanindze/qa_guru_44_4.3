plugins {
    id 'java'
    id 'io.qameta.allure' version '4.3.0'
}

group = 'qa.guru'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

def allureVersion = "2.32.0"

allure {
    version.set(allureVersion)
    adapter {
        allureJavaVersion.set(allureVersion)
        aspectjWeaver.set(true)
    }
}

dependencies {
    testImplementation("org.apache.commons:commons-lang3:3.21.0")
    testImplementation("org.apache.commons:commons-collections4:4.6.0")
    testCompileOnly("org.projectlombok:lombok:1.18.48")
    testAnnotationProcessor("org.projectlombok:lombok:1.18.48")

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation("org.assertj:assertj-core:3.27.7")
    testImplementation("net.datafaker:datafaker:2.7.0")

    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation 'com.codeborne:selenide:7.19.1'
    testImplementation 'io.qameta.allure:allure-selenide:2.32.0'
}

test {
    useJUnitPlatform()
    systemProperties(System.getProperties())
    ignoreFailures = true

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}
